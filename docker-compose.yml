# iShifo — Docker Compose (barcha sozlamalar .env dan)
#
# Dev infra:     docker compose up -d
# To'liq stack:  docker compose --profile app up -d --build
# Production:    docker compose --profile prod up -d --build
# Monitoring:    docker compose --profile monitoring up -d

name: ishifo

x-env: &env
  env_file:
    - .env

services:
  # ── INFRA ───────────────────────────────────────────────────────
  postgres:
    <<: *env
    image: postgres:16-alpine
    container_name: ishifo-db
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - '${POSTGRES_PUBLISH}:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"']
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - ishifo

  redis:
    <<: *env
    image: redis:7-alpine
    container_name: ishifo-redis
    command: >
      sh -c 'if [ -n "$$REDIS_PASSWORD" ]; then
        exec redis-server --appendonly yes --requirepass "$$REDIS_PASSWORD";
      else
        exec redis-server --appendonly yes;
      fi'
    ports:
      - '${REDIS_PUBLISH}:6300'
    volumes:
      - redis_data:/data
    healthcheck:
      test: >
        sh -c 'if [ -n "$$REDIS_PASSWORD" ]; then
          redis-cli -a "$$REDIS_PASSWORD" ping | grep -q PONG;
        else
          redis-cli ping | grep -q PONG;
        fi'
      interval: 5s
      timeout: 3s
      retries: 5
    restart: unless-stopped
    networks:
      - ishifo

  minio:
    <<: *env
    image: minio/minio:latest
    container_name: ishifo-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    ports:
      - '${MINIO_PUBLISH}:9000'
      - '${MINIO_CONSOLE}:9001'
    volumes:
      - minio_data:/data
    healthcheck:
      test: ['CMD', 'curl', '-f', 'http://localhost:9000/minio/health/live']
      interval: 10s
      timeout: 5s
      retries: 3
    restart: unless-stopped
    networks:
      - ishifo

  turn:
    <<: *env
    profiles: [app]
    image: coturn/coturn:latest
    container_name: ishifo-turn
    command:
      - -n
      - --log-file=stdout
      - --realm=${TURN_REALM}
      - --lt-cred-mech
      - --user=${TURN_USERNAME}:${TURN_PASSWORD}
      - --listening-port=${TURN_PORT:-3499}
      - --listening-ip=0.0.0.0
      - --min-port=49152
      - --max-port=49200
    ports:
      - '${TURN_PUBLISH:-3499}:${TURN_PORT:-3499}'
      - '${TURN_PUBLISH:-3499}:${TURN_PORT:-3499}/udp'
    restart: unless-stopped
    networks:
      - ishifo

  coturn:
    <<: *env
    image: coturn/coturn:4.6.2
    container_name: ishifo-coturn
    profiles: [prod]
    # Shell-form: TURN_EXTERNAL_IP o'rnatilgan bo'lsa --external-ip qo'shiladi.
    # Docker ichida coturn'ning ichki IP'si relay sifatida e'lon qilinmasligi uchun
    # SHART — bu bo'lmasa brauzer TURN relay'ga yeta olmaydi (video qora qoladi).
    # Bo'sh bo'lsa flag umuman qo'shilmaydi (regressiya yo'q).
    entrypoint: ["/bin/sh", "-c"]
    command:
      - >
        exec turnserver -n --log-file=stdout
        --listening-port=${TURN_PORT:-3499} --listening-ip=0.0.0.0
        --fingerprint --lt-cred-mech
        --user=${TURN_USERNAME}:${TURN_PASSWORD} --realm=${TURN_REALM}
        --no-cli --min-port=49152 --max-port=49200
        $${TURN_EXTERNAL_IP:+--external-ip=$$TURN_EXTERNAL_IP}
    ports:
      - '${TURN_PUBLISH:-3499}:${TURN_PORT:-3499}/udp'
      - '${TURN_PUBLISH:-3499}:${TURN_PORT:-3499}/tcp'
      - '49152-49200:49152-49200/udp'
    restart: unless-stopped
    networks:
      - ishifo

  # ── APP (profile: app | prod) ───────────────────────────────────
  migrate:
    <<: *env
    profiles: [app, prod]
    build:
      context: .
      dockerfile: apps/api/Dockerfile
      target: runner
    container_name: ishifo-migrate
    environment:
      DATABASE_URL: ${DATABASE_URL_DOCKER}
    command: npx prisma migrate deploy
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - ishifo
    restart: 'no'

  seed:
    <<: *env
    profiles: [app]
    build:
      context: .
      dockerfile: apps/api/Dockerfile
      target: runner
    container_name: ishifo-seed
    environment:
      DATABASE_URL: ${DATABASE_URL_DOCKER}
      ALLOW_SEED: ${ALLOW_SEED}
      SEED_PASSWORD: ${SEED_PASSWORD}
    command: >
      sh -c "npx ts-node --transpile-only
      --compiler-options '{\"module\":\"commonjs\"}'
      prisma/seed.ts"
    depends_on:
      migrate:
        condition: service_completed_successfully
    networks:
      - ishifo
    restart: 'no'

  bootstrap:
    <<: *env
    profiles: [prod]
    build:
      context: .
      dockerfile: apps/api/Dockerfile
      target: runner
    container_name: ishifo-bootstrap
    environment:
      NODE_ENV: production
      DATABASE_URL: ${DATABASE_URL_DOCKER}
      ADMIN_BOOTSTRAP_EMAIL: ${ADMIN_BOOTSTRAP_EMAIL}
      ADMIN_BOOTSTRAP_PASSWORD: ${ADMIN_BOOTSTRAP_PASSWORD}
      ADMIN_BOOTSTRAP_NAME: ${ADMIN_BOOTSTRAP_NAME}
      UT_FACILITY_CODES: ${UT_FACILITY_CODES}
      ALLOW_SEED: 'false'
    command: >
      sh -c "npx ts-node --transpile-only
      --compiler-options '{\"module\":\"commonjs\"}'
      prisma/bootstrap.ts"
    depends_on:
      migrate:
        condition: service_completed_successfully
    networks:
      - ishifo
    restart: 'no'

  api:
    <<: *env
    profiles: [app, prod]
    build:
      context: .
      dockerfile: apps/api/Dockerfile
      target: runner
    container_name: ishifo-api
    ports:
      - '${API_PUBLISH}:3001'
    environment:
      NODE_ENV: ${NODE_ENV:-development}
      DATABASE_URL: ${DATABASE_URL_DOCKER}
      REDIS_URL: ${REDIS_URL_DOCKER}
      S3_ENDPOINT: ${S3_ENDPOINT_DOCKER}
      PORT: ${PORT}
    depends_on:
      migrate:
        condition: service_completed_successfully
      seed:
        condition: service_completed_successfully
        required: false
      bootstrap:
        condition: service_completed_successfully
        required: false
      redis:
        condition: service_started
      minio:
        condition: service_started
    healthcheck:
      test: ['CMD', 'wget', '-qO-', 'http://localhost:3001/api/health/ready']
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    restart: unless-stopped
    networks:
      - ishifo

  web:
    <<: *env
    profiles: [app, prod]
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      target: runner
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL}
        NEXT_PUBLIC_TURN_URL: ${NEXT_PUBLIC_TURN_URL}
        NEXT_PUBLIC_TURN_USERNAME: ${NEXT_PUBLIC_TURN_USERNAME}
        NEXT_PUBLIC_TURN_CREDENTIAL: ${NEXT_PUBLIC_TURN_CREDENTIAL}
    container_name: ishifo-web
    ports:
      - '${WEB_PUBLISH}:3000'
    environment:
      NODE_ENV: ${NODE_ENV:-development}
      HOSTNAME: 0.0.0.0
      PORT: 3000
      INTERNAL_API_URL: ${INTERNAL_API_URL}
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ['CMD', 'wget', '-qO-', 'http://127.0.0.1:3000']
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    restart: unless-stopped
    networks:
      - ishifo

  # Host nginx (Docker'dan tashqarida) TLS terminatsiya va domen marshrutlashni
  # bajaradi — u to'g'ridan-to'g'ri web:3000 / api:3001 ga proxy qiladi.
  # Bu konteyner ikkinchi qavat proxy edi: sertifikatlar ikki joyda (certbot
  # /etc/letsencrypt va infra/nginx/ssl) saqlanib, sinxron qolmasdi.
  # `legacy` profilida — `--profile prod` uni ishga tushirmaydi.
  nginx:
    <<: *env
    image: nginx:1.27-alpine
    container_name: ishifo-nginx
    profiles: [legacy]
    ports:
      - '${NGINX_HTTP_PORT}:80'
      - '${NGINX_HTTPS_PORT}:443'
    volumes:
      - ./infra/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./infra/nginx/ssl:/etc/nginx/ssl:ro
    depends_on:
      - web
      - api
    restart: unless-stopped
    networks:
      - ishifo

  backup:
    <<: *env
    image: postgres:16-alpine
    container_name: ishifo-backup
    profiles: [ops]
    environment:
      BACKUP_DIR: /backups/postgres
      RETENTION_DAYS: ${BACKUP_RETENTION_DAYS}
    volumes:
      - ./backups/postgres:/backups/postgres
    entrypoint: >
      sh -c 'mkdir -p /backups/postgres && while true; do
        FILE="/backups/postgres/ishifo_$$(date +%Y%m%d_%H%M%S).sql.gz";
        echo "Backup: $$FILE";
        PGPASSWORD="$$POSTGRES_PASSWORD" pg_dump -h postgres -U "$$POSTGRES_USER" "$$POSTGRES_DB" | gzip > "$$FILE";
        find /backups/postgres -name "*.sql.gz" -mtime +"$${RETENTION_DAYS}" -delete;
        sleep 86400;
      done'
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - ishifo

  # ── MONITORING (profile: monitoring) ────────────────────────────
  prometheus:
    <<: *env
    image: prom/prometheus:v2.55.0
    container_name: ishifo-prometheus
    profiles: [monitoring]
    volumes:
      - ./infra/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    entrypoint:
      - /bin/sh
      - -c
      - |
        printf '%s' "$$METRICS_BEARER_TOKEN" > /tmp/metrics_token
        exec /bin/prometheus \
          --config.file=/etc/prometheus/prometheus.yml \
          --storage.tsdb.path=/prometheus
    ports:
      - '${PROMETHEUS_PUBLISH}:9090'
    restart: unless-stopped
    networks:
      - ishifo

  grafana:
    <<: *env
    image: grafana/grafana:11.3.0
    container_name: ishifo-grafana
    profiles: [monitoring]
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD}
      GF_USERS_ALLOW_SIGN_UP: 'false'
    volumes:
      - grafana_data:/var/lib/grafana
      - ./infra/grafana/provisioning/datasources:/etc/grafana/provisioning/datasources:ro
      - ./infra/grafana/provisioning/dashboards:/etc/grafana/provisioning/dashboards:ro
      - ./infra/grafana/dashboards:/etc/grafana/provisioning/dashboards-json:ro
    ports:
      - '${GRAFANA_PUBLISH}:3000'
    depends_on:
      - prometheus
    restart: unless-stopped
    networks:
      - ishifo

volumes:
  postgres_data:
  redis_data:
  minio_data:
  prometheus_data:
  grafana_data:

networks:
  ishifo:
    name: ishifo_internal
    driver: bridge
