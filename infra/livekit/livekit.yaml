# LiveKit SFU — Google Meet uslubidagi media server.
# API kalitlari va node IP docker-compose command orqali .env dan keladi.
port: 7880
bind_addresses:
  - "0.0.0.0"
rtc:
  # Bitta UDP port (single-port mux): barcha media shu portdan o'tadi.
  # Server NAT (MikroTik) ortida — routerda faqat UDP 50000 ochiq; 50000-50050
  # diapazon emas. Diapazon ishlatilsa tashqi klientlar UDP orqali ulanolmaydi.
  udp_port: 50000
  # UDP yopiq tarmoqlar uchun zaxira (routerda ochiq)
  tcp_port: 7881
  use_external_ip: false
logging:
  level: info
