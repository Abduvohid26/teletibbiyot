# Host nginx (Docker'dan TASHQARIDA) — /etc/nginx/sites-available/ishifo.uz
# Symlink: ln -s /etc/nginx/sites-available/ishifo.uz /etc/nginx/sites-enabled/
#
# Docker ichidagi ishifo-nginx o'rniga ishlatiladi (u `legacy` profilida).
# Sertifikatlarni certbot boshqaradi — nusxalash SHART EMAS.

upstream ishifo_web {
  server 127.0.0.1:3000;
}

upstream ishifo_api {
  server 127.0.0.1:3001;
}

limit_req_zone $binary_remote_addr zone=ishifo_auth:10m rate=10r/m;
limit_req_zone $binary_remote_addr zone=ishifo_api:10m rate=60r/s;

server {
  listen 80;
  listen [::]:80;
  server_name ishifo.uz www.ishifo.uz;

  location /.well-known/acme-challenge/ {
    root /var/www/certbot;
  }

  location / {
    return 301 https://$host$request_uri;
  }
}

server {
  listen 443 ssl;
  listen [::]:443 ssl;
  http2 on;
  server_name ishifo.uz www.ishifo.uz;

  ssl_certificate     /etc/letsencrypt/live/ishifo.uz/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/ishifo.uz/privkey.pem;
  ssl_protocols       TLSv1.2 TLSv1.3;
  ssl_ciphers         HIGH:!aNULL:!MD5;
  ssl_prefer_server_ciphers on;

  add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
  add_header X-Frame-Options "SAMEORIGIN" always;
  add_header X-Content-Type-Options "nosniff" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;

  client_max_body_size 200M;

  # WebSocket (video signaling) — Upgrade header'lari SHART,
  # aks holda video ulanmaydi.
  location /socket.io/ {
    proxy_pass http://ishifo_api/socket.io/;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 86400;
  }

  location /api/auth/login {
    limit_req zone=ishifo_auth burst=5 nodelay;
    proxy_pass http://ishifo_api/api/auth/login;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location /api/ {
    limit_req zone=ishifo_api burst=30 nodelay;
    proxy_pass http://ishifo_api/api/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location / {
    proxy_pass http://ishifo_web;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }
}
