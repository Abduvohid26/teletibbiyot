name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Security audit
        run: npm audit --audit-level=high

      - name: Generate Prisma client
        run: npm run prisma:generate --workspace=@ishifo/api

      - name: Build
        run: npm run build
        env:
          NEXT_PUBLIC_API_URL: http://localhost:3001
          JWT_SECRET: ci-test-jwt-secret-minimum-32-characters-long

      - name: Docker build API
        run: docker build -f apps/api/Dockerfile -t ishifo-api .

      - name: Docker build Web
        run: docker build -f apps/web/Dockerfile --build-arg NEXT_PUBLIC_API_URL=http://localhost:3001 -t ishifo-web .

  e2e:
    runs-on: ubuntu-latest
    needs: build
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: ishifo
          POSTGRES_PASSWORD: ishifo
          POSTGRES_DB: ishifo
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ishifo"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://ishifo:ishifo@localhost:5432/ishifo
      JWT_SECRET: ci-test-jwt-secret-minimum-32-characters-long
      SEED_PASSWORD: password123
      NEXT_PUBLIC_API_URL: http://localhost:3001
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright
        run: npx playwright install chromium --with-deps

      - name: Generate Prisma client
        run: npm run prisma:generate --workspace=@ishifo/api

      - name: Run migrations and seed
        run: |
          npm run db:migrate:deploy
          npm run db:seed

      - name: Start API
        run: npm run start:prod --workspace=@ishifo/api &
        env:
          PORT: 3001
          NODE_ENV: development
          E2E: 'true'

      - name: Build and start Web
        run: |
          npm run build --workspace=@ishifo/web
          npm run start --workspace=@ishifo/web &
        env:
          PORT: 3000

      - name: Wait for services
        run: |
          npx wait-on http://localhost:3001/api/health/live http://localhost:3000/login -t 120000

      - name: Unit tests
        run: npm run test:unit

      - name: E2E tests
        run: npm run test:e2e
        env:
          PLAYWRIGHT_BASE_URL: http://localhost:3000

  backup-verify:
    runs-on: ubuntu-latest
    needs: build
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: ishifo
          POSTGRES_PASSWORD: ishifo
          POSTGRES_DB: ishifo
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ishifo"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - name: Create backup and verify
        run: |
          PGPASSWORD=ishifo pg_dump -h localhost -U ishifo ishifo | gzip > /tmp/test_backup.sql.gz
          bash scripts/backup/verify-backup.sh /tmp/test_backup.sql.gz
